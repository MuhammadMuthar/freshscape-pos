<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories -- FreshScape Market POS</title>
<link rel="stylesheet" href="../css/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body data-page="categories">

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main" x-data="categoriesPage()" x-init="init()">
      <div class="page-header">
        <div>
          <div class="page-header__eyebrow">Catalog</div>
          <h1>Categories</h1>
        </div>
        <button class="btn btn-primary" @click="openCreateModal()">+ Add Category</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-if="!loading && categories.length === 0">
              <tr><td colspan="3">
                <div class="empty-state">
                  <h3>No categories yet</h3>
                  <p>Add your first category to start organizing products.</p>
                </div>
              </td></tr>
            </template>
            <template x-for="c in categories" :key="c.id">
              <tr>
                <td><strong x-text="c.name"></strong></td>
                <td class="text-soft" x-text="c.description || '\u2014'"></td>
                <td>
                  <div class="table-actions">
                    <button class="btn btn-secondary btn-sm" @click="openEditModal(c)">Edit</button>
                    <button class="btn btn-danger btn-sm" @click="deleteCategory(c)">Delete</button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Add/Edit modal -->
      <div class="modal-backdrop" x-show="showModal" x-cloak @click.self="closeModal()">
        <div class="modal">
          <div class="modal__header">
            <h2 x-text="editingId ? 'Edit category' : 'Add category'"></h2>
            <button class="modal__close" @click="closeModal()">&times;</button>
          </div>

          <form @submit.prevent="saveCategory()">
            <div class="field">
              <label>Name</label>
              <input type="text" x-model="form.name" required>
            </div>
            <div class="field">
              <label>Description</label>
              <textarea x-model="form.description" rows="3"></textarea>
            </div>
            <div class="modal__actions">
              <button type="button" class="btn btn-secondary" @click="closeModal()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving...' : 'Save category'"></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    function categoriesPage() {
      return {
        categories: [],
        loading: true,
        saving: false,
        showModal: false,
        editingId: null,
        form: {},

        async init() {
          await this.loadCategories();
        },

        async loadCategories() {
          this.loading = true;
          try {
            this.categories = await api.get('/categories');
          } catch (err) {
            toast(err.message);
          } finally {
            this.loading = false;
          }
        },

        openCreateModal() {
          this.editingId = null;
          this.form = { name: '', description: '' };
          this.showModal = true;
        },

        openEditModal(category) {
          this.editingId = category.id;
          this.form = { name: category.name, description: category.description || '' };
          this.showModal = true;
        },

        closeModal() {
          this.showModal = false;
        },

        async saveCategory() {
          this.saving = true;
          try {
            if (this.editingId) {
              await api.patch(`/categories/${this.editingId}`, this.form);
              toast('Category updated.', 'success');
            } else {
              await api.post('/categories', this.form);
              toast('Category created.', 'success');
            }
            this.closeModal();
            await this.loadCategories();
          } catch (err) {
            toast(err.message);
          } finally {
            this.saving = false;
          }
        },

        async deleteCategory(category) {
          if (!confirm(`Delete "${category.name}"? This can't be undone.`)) return;
          try {
            await api.delete(`/categories/${category.id}`);
            toast('Category deleted.', 'success');
            await this.loadCategories();
          } catch (err) {
            // Backend blocks this if products still reference the
            // category -- surface that message directly, it's clear.
            toast(err.message);
          }
        },
      };
    }
  </script>
</body>
</html>

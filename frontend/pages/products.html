<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products -- FreshScape Market POS</title>
<link rel="stylesheet" href="../css/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body data-page="products">

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main" x-data="productsPage()" x-init="init()">
      <div class="page-header">
        <div>
          <div class="page-header__eyebrow">Catalog</div>
          <h1>Products</h1>
        </div>
        <button class="btn btn-primary" @click="openCreateModal()">+ Add Product</button>
      </div>

      <!-- Filters -->
      <div class="card flex-gap" style="margin-bottom: var(--space-4); flex-wrap: wrap;">
        <input type="text" placeholder="Search name, SKU, barcode..."
               x-model="filters.search" @input.debounce.400ms="loadProducts(1)"
               style="flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: var(--font-body);">
        <select x-model="filters.category_id" @change="loadProducts(1)"
                style="padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);">
          <option value="">All categories</option>
          <template x-for="c in categories" :key="c.id">
            <option :value="c.id" x-text="c.name"></option>
          </template>
        </select>
        <select x-model="filters.is_active" @change="loadProducts(1)"
                style="padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);">
          <option value="true">Active only</option>
          <option value="false">Inactive only</option>
          <option value="">All</option>
        </select>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Product</th>
              <th>SKU</th>
              <th>Category</th>
              <th>Stock</th>
              <th>Price</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-if="!loading && products.length === 0">
              <tr><td colspan="7">
                <div class="empty-state">
                  <h3>No products found</h3>
                  <p>Try a different search, or add your first product.</p>
                </div>
              </td></tr>
            </template>
            <template x-for="p in products" :key="p.id">
              <tr>
                <td>
                  <strong x-text="p.name"></strong>
                  <div class="text-soft text-sm" x-text="p.category.name"></div>
                </td>
                <td class="mono text-sm" x-text="p.sku"></td>
                <td x-text="p.category.name"></td>
                <td>
                  <span class="mono" x-text="p.stock_quantity"></span>
                  <span x-show="p.stock_quantity <= p.minimum_stock" class="stamp stamp-low" style="margin-left: 6px;">Low</span>
                </td>
                <td class="mono" x-text="'Rs ' + parseFloat(p.selling_price).toFixed(2)"></td>
                <td>
                  <span class="stamp" :class="p.is_active ? 'stamp-active' : 'stamp-inactive'"
                        x-text="p.is_active ? 'Active' : 'Inactive'"></span>
                </td>
                <td>
                  <div class="table-actions">
                    <button class="btn btn-secondary btn-sm" @click="openEditModal(p)">Edit</button>
                    <button class="btn btn-danger btn-sm" x-show="p.is_active" @click="deactivateProduct(p)">Deactivate</button>
                  </div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="flex-between" style="margin-top: var(--space-4);" x-show="total > 0">
        <span class="text-soft text-sm">
          Showing <span x-text="products.length"></span> of <span x-text="total"></span>
        </span>
        <div class="flex-gap">
          <button class="btn btn-secondary btn-sm" :disabled="!hasPrevious" @click="loadProducts(page - 1)">Previous</button>
          <span class="text-sm mono">Page <span x-text="page"></span> / <span x-text="totalPages"></span></span>
          <button class="btn btn-secondary btn-sm" :disabled="!hasNext" @click="loadProducts(page + 1)">Next</button>
        </div>
      </div>

      <!-- Add/Edit modal -->
      <div class="modal-backdrop" x-show="showModal" x-cloak @click.self="closeModal()">
        <div class="modal">
          <div class="modal__header">
            <h2 x-text="editingId ? 'Edit product' : 'Add product'"></h2>
            <button class="modal__close" @click="closeModal()">&times;</button>
          </div>

          <form @submit.prevent="saveProduct()">
            <div class="field">
              <label>Name</label>
              <input type="text" x-model="form.name" required>
            </div>

            <div class="form-row">
              <div class="field">
                <label>SKU</label>
                <input type="text" x-model="form.sku" required>
              </div>
              <div class="field">
                <label>Barcode</label>
                <input type="text" x-model="form.barcode" required>
              </div>
            </div>

            <div class="field">
              <label>Description</label>
              <textarea x-model="form.description" rows="2"></textarea>
            </div>

            <div class="form-row">
              <div class="field">
                <label>Cost price</label>
                <input type="number" step="0.01" min="0" x-model="form.cost_price" required>
              </div>
              <div class="field">
                <label>Selling price</label>
                <input type="number" step="0.01" min="0" x-model="form.selling_price" required>
              </div>
            </div>

            <div class="form-row">
              <div class="field" x-show="!editingId">
                <label>Initial stock</label>
                <input type="number" min="0" x-model="form.stock_quantity" :required="!editingId">
              </div>
              <div class="field" x-show="editingId">
                <label>Current stock</label>
                <input type="text" :value="form.stock_quantity" disabled>
                <div class="field-hint">Adjust stock from the Inventory page, not here.</div>
              </div>
              <div class="field">
                <label>Minimum stock</label>
                <input type="number" min="0" x-model="form.minimum_stock" required>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <label>Unit</label>
                <select x-model="form.unit" required>
                  <option value="pcs">pcs</option>
                  <option value="kg">kg</option>
                  <option value="litre">litre</option>
                  <option value="box">box</option>
                  <option value="pack">pack</option>
                </select>
              </div>
              <div class="field">
                <label>Category</label>
                <select x-model="form.category_id" required>
                  <template x-for="c in categories" :key="c.id">
                    <option :value="c.id" x-text="c.name"></option>
                  </template>
                </select>
              </div>
            </div>

            <div class="modal__actions">
              <button type="button" class="btn btn-secondary" @click="closeModal()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving...' : 'Save product'"></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    function productsPage() {
      return {
        products: [],
        categories: [],
        loading: true,
        saving: false,
        page: 1,
        totalPages: 1,
        total: 0,
        hasNext: false,
        hasPrevious: false,
        filters: { search: '', category_id: '', is_active: 'true' },

        showModal: false,
        editingId: null,
        form: {},

        async init() {
          try {
            this.categories = await api.get('/categories');
          } catch (err) {
            toast(err.message);
          }
          await this.loadProducts(1);
        },

        async loadProducts(page) {
          this.loading = true;
          try {
            const params = new URLSearchParams();
            params.set('page', page);
            params.set('page_size', 20);
            if (this.filters.search) params.set('search', this.filters.search);
            if (this.filters.category_id) params.set('category_id', this.filters.category_id);
            if (this.filters.is_active !== '') params.set('is_active', this.filters.is_active);

            const result = await api.get('/products?' + params.toString());
            this.products = result.items;
            this.page = result.page;
            this.totalPages = result.total_pages;
            this.total = result.total;
            this.hasNext = result.has_next;
            this.hasPrevious = result.has_previous;
          } catch (err) {
            toast(err.message);
          } finally {
            this.loading = false;
          }
        },

        openCreateModal() {
          this.editingId = null;
          this.form = {
            name: '', sku: '', barcode: '', description: '',
            cost_price: '', selling_price: '', stock_quantity: 0,
            minimum_stock: 0, unit: 'pcs',
            category_id: this.categories[0]?.id ?? '',
          };
          this.showModal = true;
        },

        openEditModal(product) {
          this.editingId = product.id;
          this.form = {
            name: product.name, sku: product.sku, barcode: product.barcode,
            description: product.description ?? '',
            cost_price: product.cost_price, selling_price: product.selling_price,
            stock_quantity: product.stock_quantity, minimum_stock: product.minimum_stock,
            unit: product.unit, category_id: product.category_id ?? product.category.id,
          };
          this.showModal = true;
        },

        closeModal() {
          this.showModal = false;
        },

        async saveProduct() {
          this.saving = true;
          try {
            if (this.editingId) {
              // stock_quantity is intentionally never sent on update --
              // the backend rejects direct stock edits by design.
              const { stock_quantity, ...payload } = this.form;
              await api.patch(`/products/${this.editingId}`, payload);
              toast('Product updated.', 'success');
            } else {
              await api.post('/products', this.form);
              toast('Product created.', 'success');
            }
            this.closeModal();
            await this.loadProducts(this.page);
          } catch (err) {
            toast(err.message);
          } finally {
            this.saving = false;
          }
        },

        async deactivateProduct(product) {
          if (!confirm(`Deactivate "${product.name}"? It will no longer appear as active but its history is kept.`)) return;
          try {
            await api.delete(`/products/${product.id}`);
            toast('Product deactivated.', 'success');
            await this.loadProducts(this.page);
          } catch (err) {
            toast(err.message);
          }
        },
      };
    }
  </script>
</body>
</html>

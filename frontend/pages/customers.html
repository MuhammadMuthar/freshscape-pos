<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers -- FreshScape Market POS</title>
<link rel="stylesheet" href="../css/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body data-page="customers">

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main" x-data="customersPage()" x-init="init()">
      <div class="page-header">
        <div>
          <div class="page-header__eyebrow">Sales</div>
          <h1>Customers</h1>
        </div>
        <button class="btn btn-primary" @click="openCreateModal()">+ Add Customer</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="!loading && customers.length === 0">
              <tr><td colspan="3">
                <div class="empty-state">
                  <h3>No customers yet</h3>
                  <p>Sales can also be made without a customer attached (walk-ins).</p>
                </div>
              </td></tr>
            </template>
            <template x-for="c in customers" :key="c.id">
              <tr>
                <td><strong x-text="c.name"></strong></td>
                <td class="text-soft" x-text="c.phone || '\u2014'"></td>
                <td class="text-soft" x-text="c.email || '\u2014'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Create modal (no edit/delete -- not supported by the backend yet) -->
      <div class="modal-backdrop" x-show="showModal" x-cloak @click.self="closeModal()">
        <div class="modal">
          <div class="modal__header">
            <h2>Add customer</h2>
            <button class="modal__close" @click="closeModal()">&times;</button>
          </div>

          <form @submit.prevent="saveCustomer()">
            <div class="field">
              <label>Name</label>
              <input type="text" x-model="form.name" required>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Phone</label>
                <input type="text" x-model="form.phone">
              </div>
              <div class="field">
                <label>Email</label>
                <input type="email" x-model="form.email">
              </div>
            </div>
            <div class="modal__actions">
              <button type="button" class="btn btn-secondary" @click="closeModal()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving...' : 'Save customer'"></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    function customersPage() {
      return {
        customers: [],
        loading: true,
        saving: false,
        showModal: false,
        form: {},

        async init() {
          await this.loadCustomers();
        },

        async loadCustomers() {
          this.loading = true;
          try {
            this.customers = await api.get('/customers');
          } catch (err) {
            toast(err.message);
          } finally {
            this.loading = false;
          }
        },

        openCreateModal() {
          this.form = { name: '', phone: '', email: '' };
          this.showModal = true;
        },

        closeModal() {
          this.showModal = false;
        },

        async saveCustomer() {
          this.saving = true;
          try {
            const payload = { name: this.form.name };
            if (this.form.phone) payload.phone = this.form.phone;
            if (this.form.email) payload.email = this.form.email;

            await api.post('/customers', payload);
            toast('Customer created.', 'success');
            this.closeModal();
            await this.loadCustomers();
          } catch (err) {
            toast(err.message);
          } finally {
            this.saving = false;
          }
        },
      };
    }
  </script>
</body>
</html>

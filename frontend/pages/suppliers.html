<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers -- FreshScape Market POS</title>
<link rel="stylesheet" href="../css/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body data-page="suppliers">

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main" x-data="suppliersPage()" x-init="init()">
      <div class="page-header">
        <div>
          <div class="page-header__eyebrow">Purchasing</div>
          <h1>Suppliers</h1>
        </div>
        <button class="btn btn-primary" @click="openCreateModal()">+ Add Supplier</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Address</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="!loading && suppliers.length === 0">
              <tr><td colspan="5">
                <div class="empty-state">
                  <h3>No suppliers yet</h3>
                  <p>Add a supplier before creating a purchase order.</p>
                </div>
              </td></tr>
            </template>
            <template x-for="s in suppliers" :key="s.id">
              <tr>
                <td><strong x-text="s.name"></strong></td>
                <td class="text-soft" x-text="s.phone || '\u2014'"></td>
                <td class="text-soft" x-text="s.email || '\u2014'"></td>
                <td class="text-soft" x-text="s.address || '\u2014'"></td>
                <td>
                  <span class="stamp" :class="s.is_active ? 'stamp-active' : 'stamp-inactive'"
                        x-text="s.is_active ? 'Active' : 'Inactive'"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Create modal (no edit/delete -- not supported by the backend yet) -->
      <div class="modal-backdrop" x-show="showModal" x-cloak @click.self="closeModal()">
        <div class="modal">
          <div class="modal__header">
            <h2>Add supplier</h2>
            <button class="modal__close" @click="closeModal()">&times;</button>
          </div>

          <form @submit.prevent="saveSupplier()">
            <div class="field">
              <label>Name</label>
              <input type="text" x-model="form.name" required>
            </div>
            <div class="form-row">
              <div class="field">
                <label>Phone</label>
                <input type="text" x-model="form.phone">
              </div>
              <div class="field">
                <label>Email</label>
                <input type="email" x-model="form.email">
              </div>
            </div>
            <div class="field">
              <label>Address</label>
              <textarea x-model="form.address" rows="2"></textarea>
            </div>
            <div class="modal__actions">
              <button type="button" class="btn btn-secondary" @click="closeModal()">Cancel</button>
              <button type="submit" class="btn btn-primary" :disabled="saving" x-text="saving ? 'Saving...' : 'Save supplier'"></button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    function suppliersPage() {
      return {
        suppliers: [],
        loading: true,
        saving: false,
        showModal: false,
        form: {},

        async init() {
          await this.loadSuppliers();
        },

        async loadSuppliers() {
          this.loading = true;
          try {
            this.suppliers = await api.get('/suppliers');
          } catch (err) {
            toast(err.message);
          } finally {
            this.loading = false;
          }
        },

        openCreateModal() {
          this.form = { name: '', phone: '', email: '', address: '' };
          this.showModal = true;
        },

        closeModal() {
          this.showModal = false;
        },

        async saveSupplier() {
          this.saving = true;
          try {
            // Send only what's filled in -- empty strings for optional
            // fields are fine to omit rather than send as "".
            const payload = { name: this.form.name };
            if (this.form.phone) payload.phone = this.form.phone;
            if (this.form.email) payload.email = this.form.email;
            if (this.form.address) payload.address = this.form.address;

            await api.post('/suppliers', payload);
            toast('Supplier created.', 'success');
            this.closeModal();
            await this.loadSuppliers();
          } catch (err) {
            toast(err.message);
          } finally {
            this.saving = false;
          }
        },
      };
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard -- FreshScape Market POS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">

  <div class="app-shell">
    <div id="sidebar-root"></div>

    <main class="main">
      <div class="page-header">
        <div>
          <div class="page-header__eyebrow">Overview</div>
          <h1>Dashboard</h1>
        </div>
      </div>

      <div class="kpi-grid" id="kpi-grid">
        <div class="card">
          <div class="kpi-label">Active Products</div>
          <div class="kpi-value mono" id="kpi-products">&hellip;</div>
        </div>
        <div class="card">
          <div class="kpi-label">Low Stock</div>
          <div class="kpi-value mono" id="kpi-low-stock">&hellip;</div>
        </div>
        <div class="card">
          <div class="kpi-label">Pending Purchase Orders</div>
          <div class="kpi-value mono" id="kpi-pending-po">&hellip;</div>
        </div>
        <div class="card">
          <div class="kpi-label">Today's Sales</div>
          <div class="kpi-value mono" id="kpi-today-sales">&hellip;</div>
        </div>
      </div>

      <div class="card">
        <h3>Low stock products</h3>
        <p class="text-soft text-sm">Products at or below their minimum stock level.</p>
        <div id="low-stock-list"></div>
      </div>

      <div class="card" style="margin-top: var(--space-5);">
        <h3>Today's stock movement</h3>
        <p class="text-soft text-sm">Net change by transaction type, today.</p>
        <div id="daily-summary-list"></div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script>
    async function loadDashboard() {
      try {
        const productsPage = await api.get('/products?page=1&page_size=1&is_active=true');
        document.getElementById('kpi-products').textContent = productsPage.total;

        // Real aggregate endpoint now, not a client-side approximation.
        const lowStock = await api.get('/reports/low-stock');
        const lowStockEl = document.getElementById('kpi-low-stock');
        lowStockEl.textContent = lowStock.length;
        if (lowStock.length > 0) lowStockEl.classList.add('is-alert');

        const listEl = document.getElementById('low-stock-list');
        if (lowStock.length === 0) {
          listEl.innerHTML = '<p class="text-soft text-sm" style="margin-top: var(--space-3);">Nothing running low right now.</p>';
        } else {
          listEl.innerHTML = `
            <table style="margin-top: var(--space-3);">
              <thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Minimum</th></tr></thead>
              <tbody>
                ${lowStock.map(p => `
                  <tr>
                    <td>${p.name}</td>
                    <td class="mono text-sm">${p.sku}</td>
                    <td class="mono">${p.stock_quantity}</td>
                    <td class="mono text-soft">${p.minimum_stock}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

        const pendingPOs = await api.get('/purchase-orders?status=pending&page=1&page_size=1');
        document.getElementById('kpi-pending-po').textContent = pendingPOs.total;

        const recentSales = await api.get('/sales?page=1&page_size=100');
        const today = new Date().toDateString();
        const todayTotal = recentSales.items
          .filter(s => new Date(s.created_at).toDateString() === today)
          .reduce((sum, s) => sum + parseFloat(s.total_amount), 0);
        document.getElementById('kpi-today-sales').textContent = 'Rs ' + todayTotal.toFixed(2);

        // Real daily aggregate from the backend, grouped by transaction type.
        const summary = await api.get('/reports/daily-summary');
        const summaryEl = document.getElementById('daily-summary-list');
        if (summary.total_transactions === 0) {
          summaryEl.innerHTML = '<p class="text-soft text-sm" style="margin-top: var(--space-3);">No inventory movement recorded today yet.</p>';
        } else {
          summaryEl.innerHTML = `
            <table style="margin-top: var(--space-3);">
              <thead><tr><th>Type</th><th>Transactions</th><th>Net Change</th></tr></thead>
              <tbody>
                ${summary.breakdown.map(b => `
                  <tr>
                    <td><span class="stamp stamp-${b.transaction_type === 'sale' ? 'low' : (b.transaction_type === 'adjustment' ? 'pending' : 'active')}">${b.transaction_type}</span></td>
                    <td class="mono">${b.transaction_count}</td>
                    <td class="mono" style="color: ${b.net_quantity_change >= 0 ? 'var(--market-green)' : 'var(--stamp-red)'}">
                      ${b.net_quantity_change >= 0 ? '+' : ''}${b.net_quantity_change}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        }

      } catch (err) {
        toast(err.message);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
